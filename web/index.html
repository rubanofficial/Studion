<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="Studion is a focus timer and study analytics instrument. Track where your hours actually go — DSA, Java, PostgreSQL, System Design — and see the patterns in how you work." />
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studion" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#5eead4" />

    <title>Studion</title>

    <script>
      /*
       * Theme bootstrap, deliberately inline and synchronous.
       *
       * This runs before the first paint so the correct palette is applied
       * without a flash of the wrong theme. It also survives the app failing to
       * boot entirely — the user still gets the theme they chose, not a white
       * flash on a dark-mode machine.
       */
      (function () {
        try {
          var stored = localStorage.getItem('focusforge.theme');
          var motion = localStorage.getItem('focusforge.motion');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-motion', motion === 'reduced' ? 'reduced' : 'full');

          var accent = localStorage.getItem('focusforge.accent');
          if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            var r = parseInt(accent.slice(1, 3), 16);
            var g = parseInt(accent.slice(3, 5), 16);
            var b = parseInt(accent.slice(5, 7), 16);
            document.documentElement.style.setProperty('--accent', r + ' ' + g + ' ' + b);
          }
        } catch (error) {
          /* Private browsing can throw on localStorage access; the defaults stand. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #eef1f6; background: #08090c; min-height: 100vh">
        <h1 style="font-size: 1.25rem; margin-bottom: 0.5rem">Studion needs JavaScript</h1>
        <p style="color: #98a1b2; max-width: 40rem">
          The timer is built on precise timestamps and runs entirely in your browser, so it cannot work without
          JavaScript enabled.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
